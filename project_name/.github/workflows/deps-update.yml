# Needs "Allow GitHub Actions to create and approve pull requests" enabled in
# Settings > Actions > General, or creating the pull request fails.
name: Update Dependencies

on:
  workflow_dispatch:

permissions: {}

jobs:
  update-deps:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write  # to dispatch the tests

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          cache-suffix: deps-update
      - name: Sync dependencies
        run: uv sync
      - name: Update dependencies
        run: uv run just deps-update
      - name: Run security audit
        id: audit
        run: |
          echo 'AUDIT<<EOF' >> "$GITHUB_OUTPUT"
          uv run just deps-audit 2>&1 || true
          echo 'EOF' >> "$GITHUB_OUTPUT"
      - name: Check outdated packages
        id: outdated
        run: |
          echo 'OUTDATED<<EOF' >> "$GITHUB_OUTPUT"
          uv run just deps-list-outdated 2>&1 || true
          echo 'EOF' >> "$GITHUB_OUTPUT"
      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "⬆️ Update project dependencies"
          title: "⬆️ Update project dependencies"
          body: |
            Automated dependency update.

            ## Security Audit
            ```
            ${{ steps.audit.outputs.AUDIT }}
            ```

            ## Outdated Packages
            ```
            ${{ steps.outdated.outputs.OUTDATED }}
            ```
          branch: deps/update
          delete-branch: true
          labels: dependencies
      - name: Run tests on the pull request
        # Pull requests opened with GITHUB_TOKEN trigger no `pull_request` workflows,
        # but `workflow_dispatch` is exempt, and its checks show on the PR head.
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref deps/update
